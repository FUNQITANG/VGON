[project]
name = "vgon"
version = "0.1.0"
description = "Variational Generative Optimization Network (VGON)."
authors = [
    {name = "Lingxia Zhang"},
]

requires-python = ">=3.11"

dependencies = [
    "cvxpy>=1.7.1",
    "cvxpylayers>=0.1.9",
]


[tool.setuptools]
packages = []
py-modules = []

[project.urls]
Homepage = "https://vgon.funqitang.cn"
Repository = "https://github.com/zhangjianjianzz/VGON.git"
Documentation = "https://vgon.funqitang.cn"

[project.optional-dependencies]
####if torch: CPU or CUDA
cuda = [
    "torch[opt-einsum]>=2.9.0",
]
cuda129 = [
    "torch[opt-einsum]>=2.9.0",
]
cpu = [
    "torch[opt-einsum]",
    "typing-extensions>=4.15.0",
]
####endif  torch: CPU or CUDA
doc = [
    "mdx-truly-sane-lists>=1.3",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material>=9.6.23",
]
notebook = [
    "ipykernel>=7.1.0",
]
plot = [
    "pandas>=2.3.3",
    "ptiprince",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
]
qsimu = [
    "pennylane>=0.43.0",
    "pennylane-lightning>=0.43.0",
    "toqito>=1.1.2",
]
[dependency-groups]
full= [
    "vgon[doc,notebook,plot,qsimu]",
]


[tool.uv]
conflicts = [
    [
        {extra = "cuda"},
        {extra = "cpu"},
        {extra = "cuda129"},
    ],
]

[tool.uv.sources]
# "pytorch-cpu", "pytorch-cuda"
# For users outside of CUDA eco, redirect torch.index to "pytorch-cpu"
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda-130", extra = "cuda" },
    { index = "pytorch-cuda-129", extra = "cuda129" },
]
mkdocs-material = { git = "https://github.com/squidfunk/mkdocs-material.git" }

# pennylane = { git = "https://github.com/PennyLaneAI/pennylane.git" }
# seaborn = {git = "https://github.com/mwaskom/seaborn.git"}
toqito = {git = "https://github.com/vprusso/toqito.git"}
ptiprince = { git = "https://github.com/leo2www/PtitPrince.git" }
vgon = { workspace = true }


############
# CUDA indexes
############
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda-129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda-130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


